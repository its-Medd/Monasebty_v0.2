name: PR validation

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate project
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            eazywed/package-lock.json

      - name: Install root tools
        run: npm ci

      - name: Install application dependencies
        run: npm run install:all

      - name: Validate backend JavaScript syntax
        run: find backend -path '*/node_modules/*' -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Build frontend
        run: npm run build

      # Kept non-blocking until the existing lint errors are resolved.
      - name: Run frontend lint
        run: npm run lint
        continue-on-error: true
